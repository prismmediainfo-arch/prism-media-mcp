services:
  - type: web
    name: prism-media-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: MCP_TRANSPORT=streamable-http python server.py
    envVars:
      - key: PRISM_API_URL
        value: https://prism-backend-2m0c.onrender.com/api/v1
      - key: PRISM_SITE_URL
        value: https://prismmedia.org
      - key: PYTHON_VERSION
        value: 3.12.4
